# Cloudflare Pages settings for rhexlimited.com (static site + debate show vote counting).
# Build command (set in the Cloudflare dashboard): node debate/build-contestants.mjs
name = "rhexlimited"
pages_build_output_dir = "."
compatibility_date = "2025-09-01"
# node:crypto, Buffer and process.env for the vote and admin functions.
compatibility_flags = ["nodejs_compat"]

# Cloudflare treats this file as the source of truth for plain variables, so they live here.
# Secrets (SUPABASE_SERVICE_ROLE_KEY, PAYSTACK_SECRET_KEY, ADMIN_PASSWORD) are added in the
# dashboard under Settings -> Variables and Secrets, with type "Secret".
[vars]
SUPABASE_URL = "https://measerlamercspgkxqcv.supabase.co"
VOTE_PRICE_NAIRA = "100"
SITE_URL = "https://rhexlimited.com"
