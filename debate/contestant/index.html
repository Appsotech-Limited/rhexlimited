<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="nav">
    <div class="wrap">
      <a class="brand" href="../" aria-label="Royal Home of Excellence home">
        <img data-logo src="../assets/img/rhex-logo.png" alt="">
        <span class="wordmark">RHEX<small>Royal Home of Excellence</small></span>
      </a>
      <nav class="nav-links" aria-label="Debate show">
        <a href="./#show">The Show</a>
        <a href="./#contestants" class="keep">Contestants</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch light or dark mode">
          <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="cpage">
    <div class="wrap">
      <a class="back reveal" href="./"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>The show</a>

      <div class="section-head center finder-head">
        <span class="eyebrow both reveal">Vote for your contestant</span>
        <h1 class="reveal d1" style="font-size:clamp(2.8rem,7vw,5rem)">Find a <span class="gold-text">contestant</span></h1>
        <p class="lede reveal d2">Enter the contestant’s code to go straight to their voting page, or search by name.</p>
        <form class="finder reveal d2" id="finder" role="search" autocomplete="off">
          <label class="sr-only" for="code">Contestant code or name</label>
          <input id="code" type="search" inputmode="search" placeholder="e.g. 1120 or Splendour" enterkeyhint="go">
          <button class="btn btn-primary" type="submit">Go</button>
        </form>
        <p class="finder-msg" id="msg" role="status"></p>
      </div>

      <div class="grid-tools reveal">
        <span class="count" id="count"></span>
      </div>
      <div class="cgrid" id="grid" aria-live="polite"></div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div class="legal" style="margin-top:0;border-top:0;padding-top:0">
        <span>© <span id="year"></span> Royal Home of Excellence Ltd. · +234 810 701 1517 · +234 909 740 4887</span>
        <span>Payments secured by Paystack</span>
      </div>
    </div>
  </footer>

  <script src="data/contestants.js?v=aa0b9a5918"></script>
  <script src="assets/debate.js?v=d753969329"></script>
  <script>
    window.RHEX.ready(function () {
      var R = window.RHEX, list = (R.data.contestants || []).slice();
      list.sort(function (a, b) { return Number(a.number) - Number(b.number); });
      var input = document.getElementById("code"), grid = document.getElementById("grid");
      var count = document.getElementById("count"), msg = document.getElementById("msg");
      var totals = null;
      function clean(v) { return String(v || "").trim().replace(/^no\.?\s*/i, ""); }
      function render() {
        var term = clean(input.value);
        var shown = list.filter(function (c) { return R.matches(c, term); });
        count.textContent = shown.length + (shown.length === 1 ? " contestant" : " contestants");
        grid.innerHTML = shown.length
          ? shown.map(function (c) { return R.cardHTML(c, totals); }).join("")
          : '<div class="empty" style="grid-column:1/-1">No contestant matches “' + R.escape(term) + '”. Check the code and try again.</div>';
        return shown;
      }
      function go(c) { location.href = R.contestantUrl(c); }
      document.getElementById("finder").addEventListener("submit", function (e) {
        e.preventDefault();
        var term = clean(input.value);
        if (!term) { msg.textContent = "Type a contestant code or name."; input.focus(); return; }
        var exact = list.filter(function (c) { return String(c.number).toLowerCase() === term.toLowerCase(); })[0];
        if (exact) return go(exact);
        var shown = render();
        if (shown.length === 1) return go(shown[0]);
        msg.textContent = shown.length ? "Several contestants match. Pick yours below." : "No contestant has the code “" + term + "”.";
      });
      input.addEventListener("input", function () { msg.textContent = ""; render(); });
      // Focus the box straight away on desktop only; on phones the keyboard would cover the page.
      if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) input.focus();
      var q = new URLSearchParams(location.search).get("q");
      if (q) input.value = q;
      render();
      R.watchTally(function (t) { totals = t; render(); });
    });
  </script>
</body>
</html>
